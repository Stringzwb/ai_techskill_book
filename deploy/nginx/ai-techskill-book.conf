server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 38.22.90.174;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ai-techskill-book;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 38.22.90.174;

    client_max_body_size 310m;

    ssl_certificate /etc/letsencrypt/live/38.22.90.174/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/38.22.90.174/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    root /var/www/ai-techskill-book;
    index index.html;

    access_log /var/log/nginx/ai-techskill-book.access.log;
    error_log /var/log/nginx/ai-techskill-book.error.log warn;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }
}
