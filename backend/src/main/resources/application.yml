spring:
  # 应用名称。
  application:
    name: ai-techskill-book
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    properties:
      # Kafka 网络认证协议，例如 SASL_PLAINTEXT 或 SASL_SSL。
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      # Kafka SASL 认证机制。
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      # Kafka SASL 登录用户名。
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
    consumer:
      group-id: ${KAFKA_DOCUMENT_INDEX_GROUP:ai-techskill-book-indexer}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  # MySQL 数据源配置。
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/ai_techskill_book?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接池配置。
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
  # Redis 会话存储配置。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  # 文件上传体积限制，业务层仍需按文件类型单独校验。
  servlet:
    multipart:
      # 单文件最大体积。
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:300MB}
      # 单次 multipart 请求最大体积。
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:310MB}
  # Flyway 数据库迁移配置。
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  # 旧文章模块仍由 JPA 读取，禁止自动修改线上表结构。
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
        format_sql: false

# MyBatis-Plus 逻辑删除配置。
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Web 服务配置。
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

# 健康检查配置。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

  # 业务配置。
app:
  # LangChain4j 文字和视觉对话配置，默认关闭。
  ai:
    # 是否启用备用 AI 接口。
    enabled: ${AI_ENABLED:false}
    # OpenAI 兼容 API 根地址，LangChain4j 使用 Chat Completions 协议。
    base-url: ${AI_BASE_URL:https://www.bb-api.com/v1}
    # 文字和图片对话共用模型。
    model: ${AI_MODEL:gpt-5.5}
    # 主用 API Key，只允许从运行时环境注入。
    primary-api-key: ${AI_PRIMARY_API_KEY:}
    # 备用 API Key，主 Key 调用失败时自动切换。
    secondary-api-key: ${AI_SECONDARY_API_KEY:}
    # 单次模型请求超时时间。
    timeout: ${AI_TIMEOUT:180s}
    # 每个 Key 的 SDK 内部重试次数，主备切换由业务层处理。
    max-retries: ${AI_MAX_RETRIES:0}
    # 单次回答最大 Token 数。
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:8000}
    # 视觉接口允许的最大图片体积。
    image-max-size: ${AI_IMAGE_MAX_SIZE:10MB}
  # 文档正文和异步索引配置。
  document:
    # 仅首次迁移历史对象存储正文时开启，完成后必须关闭。
    migrate-object-storage-on-startup: ${DOCUMENT_MIGRATE_OBJECT_STORAGE_ON_STARTUP:false}
    # Markdown 正文最大 UTF-8 字节数。
    max-markdown-size: ${DOCUMENT_MAX_MARKDOWN_SIZE:1MB}
  # 文档分块与 Elasticsearch 索引配置。
  index:
    enabled: ${INDEX_ENABLED:false}
    embedding:
      # 是否调用兼容 OpenAI 的 Embeddings API。
      enabled: ${INDEX_EMBEDDING_ENABLED:false}
      # Embeddings 提供方标识。
      provider: ${INDEX_EMBEDDING_PROVIDER:openai-compatible}
      # 向量模型名称。
      model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      # OpenAI 兼容 API 地址。
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      # API 密钥只从运行时环境注入。
      api-key: ${OPENAI_API_KEY:}
      # ES dense_vector 维度，必须与模型输出一致。
      dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
    kafka:
      brokers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
      topic: ${KAFKA_DOCUMENT_INDEX_TOPIC:knowledge-document-index}
      group-id: ${KAFKA_DOCUMENT_INDEX_GROUP:ai-techskill-book-indexer}
    elasticsearch:
      endpoint: ${ELASTICSEARCH_URL:http://127.0.0.1:9200}
      username: ${ELASTICSEARCH_USERNAME:}
      password: ${ELASTICSEARCH_PASSWORD:}
      index: ${ELASTICSEARCH_INDEX:knowledge_documents}
      chunk-size: ${ELASTICSEARCH_CHUNK_SIZE:1800}
      chunk-overlap: ${ELASTICSEARCH_CHUNK_OVERLAP:200}
  # 前端跨域配置。
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # 用户会话配置。
  session:
    cookie-name: ${SESSION_COOKIE_NAME:atk_session}
    ttl: ${SESSION_TTL:7d}
    secure-cookie: ${SESSION_SECURE_COOKIE:false}
  # 用户头像配置，未上传自定义头像时使用默认头像。
  user:
    default-avatar-url: ${DEFAULT_AVATAR_URL:/default-avatar.svg}
    # 头像业务允许的最大文件体积。
    avatar-max-size: ${AVATAR_MAX_SIZE:5MB}
  # S3 兼容对象存储配置，真实凭据只允许通过环境变量注入。
  storage:
    # 是否启用对象存储客户端。
    enabled: ${STORAGE_ENABLED:false}
    # S3 兼容 API 端点。
    endpoint: ${STORAGE_ENDPOINT:}
    # S3 访问密钥标识。
    access-key: ${STORAGE_ACCESS_KEY:}
    # S3 访问密钥。
    secret-key: ${STORAGE_SECRET_KEY:}
    # 项目存储桶名称。
    bucket: ${STORAGE_BUCKET:}
    # S3 请求签名区域。
    region: ${STORAGE_REGION:us-east-1}
    # 对象键的环境隔离前缀。
    environment: ${STORAGE_ENVIRONMENT:local}
    # S3 兼容服务是否使用 Path Style 地址。
    path-style: ${STORAGE_PATH_STYLE:true}
  community:
    attachment-max-size: ${COMMUNITY_ATTACHMENT_MAX_SIZE:300MB}
    image-max-size: ${COMMUNITY_IMAGE_MAX_SIZE:20MB}
    preview-max-size: ${COMMUNITY_PREVIEW_MAX_SIZE:20MB}
  # 技术英语 AI 截图导入配置。
  tech-english:
    ai-import:
      # 当前允许的固定来源，后续可扩展为来源列表。
      source-name: ${TECH_ENGLISH_IMPORT_SOURCE_NAME:薄荷阅读}
      # 单次导入最大截图数。
      max-images: ${TECH_ENGLISH_IMPORT_MAX_IMAGES:20}
      # 单条语料允许 AI 生成的最大例句数。
      max-example-count: ${TECH_ENGLISH_IMPORT_MAX_EXAMPLES:5}
      # 识别结果等待用户确认的有效期。
      draft-ttl: ${TECH_ENGLISH_IMPORT_DRAFT_TTL:30m}
  # 微信等外部平台抓取分享信息时使用的公开站点地址。
  share:
    public-base-url: ${PUBLIC_BASE_URL:https://38.22.90.174}
